<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" role="img" aria-label="nicko-guest — Don Dominick Enargan ASCII Terminal Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F25912" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#5B91A3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F25912" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="8" y="8" width="884" height="304" rx="6"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
      .wave-back { fill: rgba(238, 236, 232, 0.12); font-size: 13px; }
      .wave-mid  { fill: rgba(91, 145, 163, 0.28); font-size: 13px; }
      .wave-front{ fill: rgba(242, 89, 18, 0.28); font-size: 13px; }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes mottoA {
        0%, 44% { opacity: 1; }
        50%, 94% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes mottoB {
        0%, 44% { opacity: 0; }
        50%, 94% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes driftSlow {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-36px); }
        100% { transform: translateX(0px); }
      }
      @keyframes driftMid {
        0% { transform: translateX(-24px); }
        50% { transform: translateX(18px); }
        100% { transform: translateX(-24px); }
      }
      @keyframes scanMove {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.18; }
        85% { opacity: 0.18; }
        100% { transform: translateY(290px); opacity: 0; }
      }
      .cursor { animation: blinkCursor 1.05s steps(1, end) infinite; }
      .motto-a { animation: mottoA 8s ease-in-out infinite; }
      .motto-b { animation: mottoB 8s ease-in-out infinite; }
      .drift-slow { animation: driftSlow 11s ease-in-out infinite; }
      .drift-mid { animation: driftMid 8.5s ease-in-out infinite; }
      .scanline { animation: scanMove 6s linear infinite; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="8" y="8" width="884" height="304" rx="6" fill="url(#bgGrad)" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Clipped Animated Wave Backdrop & Scanline -->
  <g clip-path="url(#panelClip)">
    <g class="drift-slow">
      <text class="mono wave-back" x="16" y="74" xml:space="preserve"> .,:;-~=+*#%@%#*+=~-:;,.   .,:;-~=+*#%@%#*+=~-:;,.   .,:;-~=+*#%@%#*+=~-:;,.   .,:;-~=+*#%@%#*+=~-:;,. </text>
      <text class="mono wave-back" x="16" y="236" xml:space="preserve"> ~-=+*#%@%#*+=-~   .:;-~=+*#%@%#*+=~-;:   .:;-~=+*#%@%#*+=~-;:   ~-=+*#%@%#*+=-~   .:;-~=+*#%@%#*+=~-;: </text>
    </g>
    <g class="drift-mid">
      <text class="mono wave-mid" x="16" y="92" xml:space="preserve">    .:;-~=+*#%@@%#*+=~-;:.       .:;-~=+*#%@@%#*+=~-;:.       .:;-~=+*#%@@%#*+=~-;:.       .:;-~=+*# </text>
      <text class="mono wave-mid" x="16" y="254" xml:space="preserve">  .,:;~=+*#%@%#*+=~;:,.    .,:;~=+*#%@%#*+=~;:,.    .,:;~=+*#%@%#*+=~;:,.    .,:;~=+*#%@%#*+=~;:,.   </text>
    </g>
    <g class="drift-slow">
      <text class="mono wave-front" x="16" y="270" xml:space="preserve">      ~=+*#%@@%#*+=~           ~=+*#%@@%#*+=~           ~=+*#%@@%#*+=~           ~=+*#%@@%#*+=~      </text>
    </g>
    <rect class="scanline" x="8" y="10" width="884" height="2" fill="#5B91A3"/>
  </g>

  <!-- Top Terminal Bar -->
  <rect x="8" y="8" width="884" height="36" rx="6" fill="#141414"/>
  <rect x="8" y="38" width="884" height="6" fill="#141414"/>
  <line x1="8" y1="44" x2="892" y2="44" stroke="#262626" stroke-width="1"/>

  <text class="mono" x="26" y="31" font-size="12.5" fill="#5B91A3" font-weight="600" xml:space="preserve">[00] SYSTEM_BOOT :: ~/nicko-guest</text>

  <!-- Live Status Pill -->
  <circle cx="678" cy="26" r="4.5" fill="#3ddc84">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="mono" x="690" y="30" font-size="11.5" fill="#eeece8" opacity="0.85" xml:space="preserve">ONLINE · DAVAO (UTC+8)</text>

  <!-- ASCII Art Logo: NICKO-GUEST -->
  <g transform="translate(36, 72)">
    <text class="mono" x="0" y="26" font-size="15.5" font-weight="700" fill="#eeece8" xml:space="preserve"> _   _ ___ ____ _  _____        </text>
    <text class="mono" x="0" y="45" font-size="15.5" font-weight="700" fill="#eeece8" xml:space="preserve">| \ | |_ _/ ___| |/ / _ \       </text>
    <text class="mono" x="0" y="64" font-size="15.5" font-weight="700" fill="#eeece8" xml:space="preserve">|  \| || | |   | ' / | | |_____ </text>
    <text class="mono" x="0" y="83" font-size="15.5" font-weight="700" fill="#eeece8" xml:space="preserve">| |\  || | |___| . \ |_| |_____|</text>
    <text class="mono" x="0" y="102" font-size="15.5" font-weight="700" fill="#eeece8" xml:space="preserve">|_| \_|___\____|_|\_\___/       </text>

    <text class="mono" x="305" y="26" font-size="15.5" font-weight="700" fill="#F25912" xml:space="preserve"> ____ _   _ _____ ____ _____ </text>
    <text class="mono" x="305" y="45" font-size="15.5" font-weight="700" fill="#F25912" xml:space="preserve">/ ___| | | | ____/ ___|_   _|</text>
    <text class="mono" x="305" y="64" font-size="15.5" font-weight="700" fill="#F25912" xml:space="preserve">| |  _| | | |  _| \___ \ | |  </text>
    <text class="mono" x="305" y="83" font-size="15.5" font-weight="700" fill="#F25912" xml:space="preserve">| |_| | |_| | |___ ___) || |  </text>
    <text class="mono" x="305" y="102" font-size="15.5" font-weight="700" fill="#F25912" xml:space="preserve"> \____|\___/|_____|____/ |_|  </text>

    <!-- Blinking Block Cursor -->
    <rect class="cursor" x="598" y="88" width="11" height="17" fill="#5B91A3"/>
  </g>

  <!-- Identity & Role -->
  <line x1="36" y1="194" x2="864" y2="194" stroke="url(#accentLine)" stroke-width="1"/>
  <text class="mono" x="36" y="218" font-size="15" font-weight="700" fill="#eeece8" xml:space="preserve">DON DOMINICK ENARGAN</text>
  <text class="mono" x="242" y="218" font-size="14" fill="#5B91A3" xml:space="preserve">·  Full-Stack, Backend &amp; Systems Developer</text>
  <text class="mono" x="36" y="241" font-size="12.5" fill="#eeece8" opacity="0.72" xml:space="preserve">B.S. IT @ DNSC ('27)  ·  DOST-SEI Scholar  ·  Founder &amp; President, CoDeX  ·  Building systems built to hold up.</text>

  <!-- Animated Bottom Philosophy Bar (inspired by AsciiMotto.tsx) -->
  <rect x="24" y="264" width="852" height="34" rx="4" fill="#141414" stroke="#262626" stroke-width="1"/>
  <g class="motto-a">
    <text class="mono" x="38" y="286" font-size="12.5" fill="#5B91A3" xml:space="preserve">$ cat PHILOSOPHY.txt  &gt;</text>
    <text class="mono" x="228" y="286" font-size="12.5" fill="#eeece8" font-weight="600" xml:space="preserve">"Good code is invisible."</text>
  </g>
  <g class="motto-b">
    <text class="mono" x="38" y="286" font-size="12.5" fill="#F25912" xml:space="preserve">[X-RAY] HONEST_VERSION.txt  &gt;</text>
    <text class="mono" x="275" y="286" font-size="12.5" fill="#eeece8" font-weight="600" xml:space="preserve">"Until it breaks. Then I fix it."</text>
  </g>
</svg>
